name: 🐛 Bug Report
description: Create a report to help us improve Frontal TypeScript Linter
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Please provide clear steps to reproduce the issue (code snippets, commands).
      placeholder: |
        1. Create a file with content X
        2. Run `ts-linter check`
        3. See error Y
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Linter Version
      description: What version of @frontal/ts-linter are you running? (e.g., 0.1.0)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Copy and paste any relevant logs here.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
